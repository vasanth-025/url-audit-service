<svg viewBox="0 0 680 708" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagTitle diagDesc">
<title id="diagTitle">URL audit service architecture at scale</title>
<desc id="diagDesc">Client sends requests through an API gateway to a stateless FastAPI tier, which checks Redis cache; on a hit it responds instantly, on a miss it enqueues a job to a Redis-backed queue processed by a worker pool, which writes results to PostgreSQL.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .th { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
  .ts { font-size: 12px; fill: #444; }
  .arr { stroke: #666; stroke-width: 1.5; fill: none; }
  .gray  { fill: #eef0f2; stroke: #b9c0c7; }
  .teal  { fill: #e3f4f2; stroke: #7fcdc4; }
  .purple{ fill: #efe7fb; stroke: #b6a0e6; }
  .amber { fill: #fdf1dc; stroke: #e6b866; }
  .coral { fill: #fde6e2; stroke: #ec9a8c; }
  .blue  { fill: #e5eefc; stroke: #96b8ec; }
</style>

<line x1="340" y1="84" x2="340" y2="142" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="188" x2="340" y2="246" class="arr" marker-end="url(#arrow)"/>
<path d="M250 304 L170 304 L170 378" class="arr" marker-end="url(#arrow)"/>
<path d="M430 304 L510 304 L510 378" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="436" x2="510" y2="494" class="arr" marker-end="url(#arrow)"/>
<path d="M510 552 L340 552 L340 610" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="260" y="40" width="160" height="44" rx="8" class="gray" stroke-width="1"/>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Client</text>
</g>

<g>
<rect x="260" y="144" width="160" height="44" rx="8" class="gray" stroke-width="1"/>
<text class="th" x="340" y="166" text-anchor="middle" dominant-baseline="central">API gateway</text>
</g>

<g>
<rect x="190" y="248" width="300" height="56" rx="10" class="teal" stroke-width="1"/>
<text class="th" x="340" y="270" text-anchor="middle" dominant-baseline="central">FastAPI service tier</text>
<text class="ts" x="340" y="288" text-anchor="middle" dominant-baseline="central">Stateless, autoscaled pods</text>
</g>

<g>
<rect x="60" y="380" width="220" height="56" rx="10" class="purple" stroke-width="1"/>
<text class="th" x="170" y="402" text-anchor="middle" dominant-baseline="central">Redis cache</text>
<text class="ts" x="170" y="420" text-anchor="middle" dominant-baseline="central">Cache hit: instant response</text>
</g>

<g>
<rect x="400" y="380" width="220" height="56" rx="10" class="amber" stroke-width="1"/>
<text class="th" x="510" y="402" text-anchor="middle" dominant-baseline="central">Task queue (Redis)</text>
<text class="ts" x="510" y="420" text-anchor="middle" dominant-baseline="central">Cache miss: job enqueued</text>
</g>

<g>
<rect x="400" y="496" width="220" height="56" rx="10" class="coral" stroke-width="1"/>
<text class="th" x="510" y="518" text-anchor="middle" dominant-baseline="central">Worker pool</text>
<text class="ts" x="510" y="536" text-anchor="middle" dominant-baseline="central">Runs audits, scales 5-20</text>
</g>

<g>
<rect x="230" y="612" width="220" height="56" rx="10" class="blue" stroke-width="1"/>
<text class="th" x="340" y="634" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="ts" x="340" y="652" text-anchor="middle" dominant-baseline="central">Job status &amp; results</text>
</g>
</svg>
